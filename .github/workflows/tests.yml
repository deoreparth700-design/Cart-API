name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TEST_DATABASE_URL: postgresql://cart_api_test:ci_test_password@localhost:5432/cart_api_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cart_api_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: cart_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cart_api_test -d cart_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure isolated CI environment
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://app_user:app_password@localhost:5432/cart_api_development
          TEST_DATABASE_URL=postgresql://cart_api_test:ci_test_password@localhost:5432/cart_api_test
          JWT_SECRET=ci-only-jwt-secret-for-tests
          JWT_ALGORITHM=HS256
          RAZORPAY_KEY_ID=rzp_test_ci_dummy_key
          RAZORPAY_KEY_SECRET=ci-only-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET=ci-only-webhook-secret
          DEMO_MODE=false
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize isolated PostgreSQL schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          with psycopg.connect(os.environ["TEST_DATABASE_URL"], autocommit=True) as conn:
              conn.execute(Path("db/schema.sql").read_text(encoding="utf-8"))
              conn.execute(Path("db/seed.sql").read_text(encoding="utf-8"))
          PY

      - name: Run test suite
        run: python -m pytest -q
