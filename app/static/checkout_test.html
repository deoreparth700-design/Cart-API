<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartAPI - Razorpay Checkout Test</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px auto;
            max-width: 560px;
            padding: 24px;
            background-color: #f7fafc;
            color: #2d3748;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 16px;
        }
        .param {
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .param strong {
            display: inline-block;
            width: 130px;
        }
        button {
            margin-top: 16px;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .success {
            background-color: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        .error {
            background-color: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Razorpay Checkout Test</h1>
        <p>This test page opens Razorpay Checkout using parameters from the URL. It does NOT mark the order as paid.</p>

        <div class="param"><strong>Order ID:</strong> <span id="val-order-id">-</span></div>
        <div class="param"><strong>Amount (paise):</strong> <span id="val-amount">-</span></div>
        <div class="param"><strong>Razorpay Key:</strong> <span id="val-key">-</span></div>

        <button id="pay-btn" onclick="openCheckout()">Open Razorpay Checkout</button>

        <div id="result"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get("order_id");
        const amount = urlParams.get("amount");
        const key = urlParams.get("key");

        document.getElementById("val-order-id").textContent = orderId || "Missing";
        document.getElementById("val-amount").textContent = amount || "Missing";
        document.getElementById("val-key").textContent = key || "Missing";

        function showResult(message, isError) {
            const resEl = document.getElementById("result");
            resEl.style.display = "block";
            resEl.className = isError ? "error" : "success";
            resEl.textContent = message;
        }

        function openCheckout() {
            if (!orderId || !amount || !key) {
                showResult("Error: URL must provide ?order_id=...&amount=...&key=...", true);
                return;
            }

            const options = {
                key: key,
                amount: parseInt(amount, 10),
                currency: "INR",
                name: "CartAPI Test Store",
                description: "Test Order Payment",
                order_id: orderId,
                handler: function (response) {
                    // Logs payment verification details without calling any backend marking endpoint
                    console.log("Payment response from Razorpay Checkout:", response);
                    showResult(
                        "Payment submitted successfully through Razorpay Checkout:\n" +
                        "razorpay_payment_id: " + response.razorpay_payment_id + "\n" +
                        "razorpay_order_id: " + response.razorpay_order_id + "\n" +
                        "razorpay_signature: " + response.razorpay_signature,
                        false
                    );
                },
                modal: {
                    ondismiss: function () {
                        console.log("Checkout modal dismissed by user.");
                    }
                }
            };

            const rzp = new Razorpay(options);
            rzp.on("payment.failed", function (response) {
                console.error("Payment failed:", response.error);
                showResult("Payment failed: " + response.error.description, true);
            });
            rzp.open();
        }

        // Automatically open checkout when valid parameters are supplied
        if (orderId && amount && key) {
            window.addEventListener("DOMContentLoaded", openCheckout);
        }
    </script>
</body>
</html>
